name: DART Update and GitHub Pages

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'config/**'
      - 'dashboard/index.html'
      - 'requirements.txt'
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

# Least-privilege permissions required by this workflow:
# - contents: write -> commit refreshed data
# - pages: write + id-token: write -> GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  START_YEAR: '2010'
  DART_CORP_CODE: '00126380'
  SAVE_RAW_REPORTS: 'false'

jobs:
  update-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Validate DART API secret
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENDART_API_KEY:-}" ]]; then
            echo "::error title=Missing OpenDART secret::OPENDART_API_KEY is not available to this workflow."
            echo "Add it under Settings > Secrets and variables > Actions > Repository secrets."
            echo "Do not place the API key in source code, workflow YAML, README, or dashboard files."
            exit 1
          fi
          if [[ "${#OPENDART_API_KEY}" -lt 20 ]]; then
            echo "::error title=Invalid OpenDART secret::OPENDART_API_KEY is present but unexpectedly short."
            exit 1
          fi
          echo "OpenDART API secret is available (value is not printed)."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ -s requirements.txt ]]; then
            pip install -r requirements.txt
          fi

      - name: Collect DART data
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python src/update_data.py

      - name: Validate collected data
        shell: bash
        run: |
          set -euo pipefail
          test -s data/financials.json
          test -s data/financials.csv
          test -s data/filings.json
          test -s data/last_update.json
          python - <<'PY'
          import json
          from pathlib import Path

          financials = json.loads(Path("data/financials.json").read_text(encoding="utf-8"))
          filings = json.loads(Path("data/filings.json").read_text(encoding="utf-8"))

          if not financials:
              raise SystemExit("ERROR: financials.json contains zero records.")
          if not filings:
              raise SystemExit("ERROR: filings.json contains zero records.")

          print(f"Validated {len(financials)} financial records and {len(filings)} filings.")
          PY

      - name: Prepare Pages data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dashboard/data
          mkdir -p dashboard/data
          cp data/financials.json dashboard/data/financials.json
          cp data/financials.csv dashboard/data/financials.csv
          cp data/filings.json dashboard/data/filings.json
          cp data/last_update.json dashboard/data/last_update.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit updated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data dashboard/data reports 2>/dev/null || git add data dashboard/data
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m "chore: update Samsung Electronics DART data"
            git push origin HEAD:main
          fi
