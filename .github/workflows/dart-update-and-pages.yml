name: DART Update and GitHub Pages

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'dashboard/index.html'
      - 'requirements.txt'
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

# Least-privilege permissions required by this workflow:
# - contents: write -> commit refreshed data
# - pages: write + id-token: write -> GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-refresh-v3
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  START_YEAR: '2010'
  DART_CORP_CODE: '00126380'
  SAVE_RAW_REPORTS: 'false'
  PARSE_LEGACY_REPORTS: 'false'
  DART_API_TIMEOUT: '25'

jobs:
  update-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ -s requirements.txt ]]; then
            pip install -r requirements.txt
          fi

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate dashboard JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("dashboard/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.IGNORECASE | re.DOTALL)
          inline_scripts = [script for script in scripts if script.strip()]
          if not inline_scripts:
              raise SystemExit("ERROR: no inline dashboard JavaScript was found.")
          Path("/tmp/dashboard-inline.js").write_text("\n".join(inline_scripts), encoding="utf-8")
          PY
          node --check /tmp/dashboard-inline.js

      - name: Check OpenDART API secret
        id: dart-secret
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.DART_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENDART_API_KEY:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=OpenDART API key missing::Data refresh was skipped; Pages will still deploy the available dashboard/data snapshot."
            echo "Register OPENDART_API_KEY under Settings > Secrets and variables > Actions to enable monthly data collection."
          elif [[ "${#OPENDART_API_KEY}" -ne 40 ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=OpenDART API key format invalid::Data refresh was skipped because the key length is not 40 characters."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "OpenDART API secret is available (value is not printed)."
          fi

      - name: Collect DART data
        if: steps.dart-secret.outputs.available == 'true'
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.DART_API_KEY }}
        run: python src/update_data.py

      - name: Validate collected data
        if: steps.dart-secret.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s data/financials.json
          test -s data/financials.csv
          test -s data/filings.json
          test -s data/last_update.json
          python - <<'PY'
          import json
          from pathlib import Path

          financials = json.loads(Path("data/financials.json").read_text(encoding="utf-8"))
          filings = json.loads(Path("data/filings.json").read_text(encoding="utf-8"))

          if not isinstance(financials, list) or not financials:
              raise SystemExit("ERROR: financials.json contains zero records or has an invalid format.")
          if not isinstance(filings, list) or not filings:
              raise SystemExit("ERROR: filings.json contains zero records or has an invalid format.")

          allowed_periods = {"annual", "half-year", "quarterly-q1", "quarterly-q3"}
          bad = []
          for i, record in enumerate(financials):
              if not isinstance(record, dict):
                  bad.append(f"record {i}: not an object")
                  continue
              if record.get("period") not in allowed_periods:
                  bad.append(f"record {i}: unknown period {record.get('period')!r}")
              if not isinstance(record.get("major"), dict):
                  bad.append(f"record {i}: major metrics are not a dictionary")
              if not isinstance(record.get("ratios"), dict):
                  bad.append(f"record {i}: ratios are not a dictionary")
              if int(record.get("year") or 0) >= 2015 and not record.get("major"):
                  bad.append(f"record {i}: no normalized financial metrics for year {record.get('year')}")
              if not record.get("rcept_no") or not record.get("year"):
                  bad.append(f"record {i}: missing filing/year identifier")
          if bad:
              raise SystemExit("ERROR: invalid financial data schema:\n" + "\n".join(bad[:20]))

          periods = {record.get("period") for record in financials if isinstance(record, dict)}
          missing = allowed_periods - periods
          if missing:
              raise SystemExit("ERROR: missing report categories: " + ", ".join(sorted(missing)))

          print(f"Validated {len(financials)} financial records and {len(filings)} filings.")
          print("Report categories: " + ", ".join(sorted(periods)))
          PY

      - name: Prepare Pages data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dashboard/data
          mkdir -p dashboard/data
          cp data/financials.json dashboard/data/financials.json
          cp data/financials.csv dashboard/data/financials.csv
          cp data/filings.json dashboard/data/filings.json
          cp data/last_update.json dashboard/data/last_update.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit updated data
        if: steps.dart-secret.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data dashboard/data reports 2>/dev/null || git add data dashboard/data
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi

          git commit -m "chore: update Samsung Electronics DART data"

          # Another run or a human edit may advance main while Pages is deploying.
          # Rebase the generated-data commit on the newest main and retry the push.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [[ -n "$conflicts" ]] && ! grep -Ev '^(data/|dashboard/data/|reports/)' <<< "$conflicts" | grep -q .; then
                echo "Resolving generated-data conflicts in favor of the fresh collection."
                while IFS= read -r path; do
                  [[ -z "$path" ]] && continue
                  git checkout --theirs -- "$path"
                  git add -- "$path"
                done <<< "$conflicts"
                GIT_EDITOR=true git rebase --continue
              else
                echo "::error title=Rebase conflict::Could not safely rebase the data update."
                git rebase --abort
                exit 1
              fi
            fi
            if git push origin HEAD:main; then
              echo "Updated data committed to main."
              exit 0
            fi
            echo "Push attempt $attempt failed because main moved; retrying."
          done
          echo "::error title=Push retries exhausted::Could not push the updated data after three attempts."
          exit 1
