name: DART Update and GitHub Pages

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'config/**'
      - 'dashboard/index.html'
      - 'requirements.txt'
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  START_YEAR: '2010'
  DART_CORP_CODE: '00126380'
  SAVE_RAW_REPORTS: 'false'

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect DART data
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python src/update_data.py

      - name: Prepare Pages data
        run: |
          rm -rf dashboard/data
          mkdir -p dashboard/data
          cp data/financials.json dashboard/data/financials.json
          cp data/financials.csv dashboard/data/financials.csv
          cp data/filings.json dashboard/data/filings.json
          cp data/last_update.json dashboard/data/last_update.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data dashboard/data reports 2>/dev/null || git add data dashboard/data
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m "chore: update Samsung Electronics DART data"
            git push
          fi
